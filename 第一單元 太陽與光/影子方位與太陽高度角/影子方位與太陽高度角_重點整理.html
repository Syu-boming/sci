  <h2>📌 今日重點</h2>
  <div class="keypoint">1️⃣ 太陽高度角<b>越大</b>，影子<b>越短</b>；<br>太陽高度角<b>越小</b>，影子<b>越長</b>。</div>
  <div class="keypoint">2️⃣ 影子的方向和太陽的方向<b>相反</b>。</div>
  <div class="keypoint">3️⃣ 太陽一天的方位：從<b>東邊</b>升起 →（一路<b>偏南</b>）→ 中午在<b>正南方</b>、位置最高 → 最後從<b>西邊</b>落下。在台灣，太陽會偏向<b>南邊</b>的天空，不會經過正頭頂。</div>
  <table class="keytab">
    <tr><th>時間</th><th>太陽位置</th><th>太陽高度角</th><th>影子方向</th><th>影子長度</th></tr>
    <tr><td>上午</td><td>東邊</td><td>小→大</td><td>西邊</td><td>長→短</td></tr>
    <tr><td>中午</td><td>南邊（最高）</td><td>最大</td><td>北邊</td><td>最短</td></tr>
    <tr><td>下午</td><td>西邊</td><td>大→小</td><td>東邊</td><td>短→長</td></tr>
  </table>
