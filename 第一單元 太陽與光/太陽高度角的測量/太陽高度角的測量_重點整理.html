  <div class="keypoint">🌙 量<b>月亮</b>：月光柔和可以直接看。手臂伸直、從地平線往上<b>疊拳頭</b>，一個拳頭約 <b>10°</b>。</div>

  <div class="keypoint">🧵 間接測量四步驟：<b>① 立竿子 → ② 找影子尖端 → ③ 從影子尖端拉棉線到竿子頂端 → ④ 用量角器量棉線和地面的夾角</b>，這個夾角就是太陽高度角。全程都不用看太陽！</div>
