<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 太陽路徑探索　數位教材</title>
  <link rel="icon" href="../image/icon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 教材頁專用：嵌入工具的框 */
    .embed-frame {
      width: 100%; height: 70vh; min-height: 420px;
      border: 1px solid var(--c-line); border-radius: var(--radius);
      box-shadow: var(--shadow); background: #fff;
    }
  </style>
</head>
<body data-theme="sun">

  <header class="site-header">
    <div class="wrap">
      <img src="../image/icon.svg" alt="站標">
      <div>
        <h1>3D 太陽路徑探索</h1>
        <p>數位教材 · 單元一 太陽與光</p>
      </div>
    </div>
  </header>

  <nav class="breadcrumb wrap"><a href="../index.html">← 回首頁</a></nav>

  <main class="wrap">

    <div class="ws-intro">
      <strong>怎麼玩：</strong>拖動地圖上的圖釘換地點、調整日期與時間，觀察太陽在天空的路徑，
      以及一天中影子方向與長短的變化。想想看：中午和傍晚的影子有什麼不同？
    </div>

    <div class="toolbar">
      <a class="btn" href="https://syu-boming.github.io/sun-path/" target="_blank" rel="noopener">🔗 另開新網頁使用工具</a>
    </div>

    <iframe class="embed-frame"
            src="https://syu-boming.github.io/sun-path/"
            title="3D 太陽路徑工具"
            loading="lazy"
            allowfullscreen></iframe>

    <p class="ws-meta" style="margin-top:10px">
      若上方載入較慢，可
      <a href="https://syu-boming.github.io/sun-path/" target="_blank" rel="noopener">另開新分頁開啟工具</a>。
    </p>

    <h2 class="section-title">🔎 觀察任務</h2>
    <div class="q">
      <ol>
        <li>把時間從清晨調到傍晚，太陽在天空是往哪個方向移動？</li>
        <li>哪個時刻影子最短？哪個時刻影子最長？</li>
        <li>換一個不同的地點，太陽的路徑有沒有改變？</li>
      </ol>
    </div>

  </main>

  <footer class="site-footer"><div class="wrap"><a href="../index.html">← 回首頁</a> · 豬豬的自然探索</div></footer>
</body>
</html>
